<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- bone tile so the thin diamond stays visible on light & dark UI -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#faf7f0"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="none" stroke="#ddd4c2" stroke-width="1.5"/>
  <!-- diamond trail-blaze, pine outline -->
  <rect x="9" y="9" width="30" height="30" rx="4" fill="none" stroke="#1b3a2a" stroke-width="3.5" transform="rotate(45 24 24)"/>
  <!-- the spot, blaze dot -->
  <circle cx="24" cy="24" r="5.6" fill="#e85d2f"/>
</svg>
