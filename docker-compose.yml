name: random-spot-walk

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: random-spot-walk:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Mount the local mkcert certs so Nginx can serve HTTPS.
    # The ./.certs directory contains cert.pem and key.pem produced by
    # mkcert (see vite.config.ts / README).
    volumes:
      - ./.certs:/etc/nginx/certs:ro
