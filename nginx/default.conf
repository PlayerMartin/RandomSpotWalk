# HTTPS-only server for the Random Spot Walk SPA.
# Replaces the stock /etc/nginx/conf.d/default.conf.

# HTTP :80 -> always redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS :443 -> serves the SPA.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Mount your certs here at runtime, e.g.
    #   -v ./certs:/etc/nginx/certs:ro
    # Files expected: nb.tail770aef.ts.net.crt (certificate chain) and
    # nb.tail770aef.ts.net.key (private key).
    ssl_certificate     /etc/nginx/certs/nb.tail770aef.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/nb.tail770aef.ts.net.key;

    # Only TLS 1.2+ (mkcert / modern browser clients).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root  /usr/share/nginx/html;
    index index.html;

    # Vite SPA fallback so client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
