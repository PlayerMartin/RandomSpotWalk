# HTTPS-only server for the Random Spot Walk SPA.
# Replaces the stock /etc/nginx/conf.d/default.conf.

# HTTP :80 -> always redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS :443 -> serves the SPA under /random-spot-walk/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Mount your certs here at runtime, e.g.
    #   -v ./certs:/etc/nginx/certs:ro
    # Files expected: cert.pem (certificate chain) and key.pem (private key).
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Only TLS 1.2+ (mkcert / modern browser clients).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root  /usr/share/nginx/html;
    index index.html;

    # Serve the SPA under /random-spot-walk/, with client-side route fallback.
    # Note: the location requires a trailing slash, so a bare /random-spot-walk
    # (no slash) does NOT match here - it's handled by the block below.
    location /random-spot-walk/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /random-spot-walk/index.html;
    }

    # /random-spot-walk without a trailing slash -> into the app (fixes 404).
    location = /random-spot-walk {
        return 301 /random-spot-walk/;
    }

    # Bare domain root -> a small landing page with a button into the app.
    location = / {
        try_files /landing.html =404;
    }
}
